<div class="login-page">

  <div class="login-left">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>

    <div class="brand">
        <div class="logo">
            <div class="logo-square"></div>
        </div>
        <h1>Orange Mali</h1>
        <h2>Gestion des stagiaires</h2>
        <p>Bienvenue sur la plateforme de gestion des stagiaires.</p>
        <p>Connectez-vous pour accéder à votre espace de travail.</p>
    </div>
    
  </div>

  <div class="login-right">
    <div class="login-card">
      <h2>Connexion</h2>
      <p class="subtitle">Entrez vos informations de connexion.</p>

      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="form-group">
            <label>Email</label>
            <div class="input-group">
                <span class="input-icon">
                    <i class="fa-solid fa-envelope"></i>
                </span>
                <input
                    type="email"
                    formControlName="email"
                    placeholder="admin@orangemali.ml">
            </div>

        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <div class="input-group">
            <span class="input-icon">
                <i class="fa-solid fa-lock"></i>
            </span>
            <input
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="********">


                <button type="button" class="toggle-password" (click)="togglePassword()">
                    <i
                        class="fa-solid"
                        [class.fa-eye]="!showPassword"
                        [class.fa-eye-slash]="showPassword">
                    </i>
                </button>
            </div>
        </div>
        <div class="remember-me">
            <label>
                <input type="checkbox">
                Se souvenir de moi
            </label>
        </div>

        <button type="submit">
            @if(isLoading){
                Connexion...
            }@else{
                Se connecter
            }
        </button>
        <div class="login-links">
            <a href="#">Mot de passe oublié ?</a>
        </div>
      </form>
    </div>

    <div class="login-footer">
       <p>© 2026 Orange Mali</p>
        <small>Plateforme de gestion des stagiaires</small>
    </div>
  </div>

</div>
