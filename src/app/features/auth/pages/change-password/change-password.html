<main class="password-page">
  <section class="password-card">
    <p class="eyebrow">Sécurité du compte</p>
    <h1>
      {{ mandatory ? 'Créez votre nouveau mot de passe' : 'Changer mon mot de passe' }}
    </h1>

    @if (mandatory) {
      <p class="notice">
        Vous devez modifier votre mot de passe temporaire avant de continuer.
      </p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      @if (errorMessage) {
        <div class="error" role="alert">{{ errorMessage }}</div>
      }

      <label for="currentPassword">Mot de passe actuel</label>
      <input
        id="currentPassword"
        [type]="showPasswords ? 'text' : 'password'"
        formControlName="currentPassword"
        autocomplete="current-password"
      />

      <label for="newPassword">Nouveau mot de passe</label>
      <input
        id="newPassword"
        [type]="showPasswords ? 'text' : 'password'"
        formControlName="newPassword"
        autocomplete="new-password"
      />
      <small>15 à 128 caractères.</small>

      <label for="confirmNewPassword">Confirmer le nouveau mot de passe</label>
      <input
        id="confirmNewPassword"
        [type]="showPasswords ? 'text' : 'password'"
        formControlName="confirmNewPassword"
        autocomplete="new-password"
      />

      <label class="show-passwords">
        <input
          type="checkbox"
          [checked]="showPasswords"
          (change)="showPasswords = !showPasswords"
        />
        Afficher les mots de passe
      </label>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Enregistrement…' : 'Enregistrer le nouveau mot de passe' }}
      </button>
    </form>
  </section>
</main>
