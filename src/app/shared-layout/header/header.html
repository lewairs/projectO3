<header class="header">
  <div class="brand-area">
    <button
      class="menu-button"
      type="button"
      [attr.aria-expanded]="layoutService.sidebarOpened()"
      [attr.aria-label]="layoutService.sidebarOpened() ? 'Masquer le menu' : 'Afficher le menu'"
      (click)="layoutService.toggleSidebar()">
      <i
        class="fa-solid"
        [class.fa-bars]="!layoutService.sidebarOpened()"
        [class.fa-xmark]="layoutService.sidebarOpened()">
      </i>
    </button>

    <div class="brand">
      <img class="logo-image" src="/images/orange_logo.jpg" alt="Orange Mali" width="42" height="42">
      <span class="brand-copy">
        <strong>{{companyName}}</strong>
        <small>{{applicationTitle}}</small>
      </span>
    </div>
  </div>

  <div class="header-right">

    <button class="notification" type="button" aria-label="Notifications">
      <i class="fa-regular fa-bell"></i>
      <span class="notification-dot" aria-hidden="true"></span>
    </button>

    <div class="user" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="user-trigger"
        aria-haspopup="menu"
        [attr.aria-expanded]="userMenuOpened()"
        (click)="toggleUserMenu($event)">
        <span class="avatar" aria-hidden="true"><i class="fa-regular fa-user"></i></span>
        <span class="user-info">
          <span class="name">{{ fullName() }}</span>
          <span class="role">{{ roleLabel() }}</span>
        </span>
        <i class="fa-solid fa-chevron-down user-chevron" [class.opened]="userMenuOpened()"></i>
      </button>

      @if (userMenuOpened()) {
        <div class="user-dropdown" role="menu">
          <div class="dropdown-profile">
            <span class="dropdown-name">{{ fullName() }}</span>
            <span class="dropdown-email">{{ user()?.email }}</span>
          </div>
          <button type="button" class="logout" role="menuitem" (click)="logout()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Déconnexion</span>
          </button>
        </div>
      }
    </div>

  </div>

</header>
