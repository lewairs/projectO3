<nav aria-label="Pagination"><button type="button" [disabled]="page() <= 1" (click)="goTo(page() - 1)" aria-label="Page précédente"><i class="fa-solid fa-chevron-left"></i></button>@for (item of pages(); track item) { <button type="button" [class.active]="item === page()" [attr.aria-current]="item === page() ? 'page' : null" (click)="goTo(item)">{{ item }}</button> }<button type="button" [disabled]="page() >= totalPages()" (click)="goTo(page() + 1)" aria-label="Page suivante"><i class="fa-solid fa-chevron-right"></i></button></nav>
